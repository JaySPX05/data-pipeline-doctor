# S01: vendor renames a column after each feed release. Demo "Memory ON" moment.
id: S01
name: vendor_schema_change
dag_id: orders_etl
task_id: load_orders
verdict: UPSTREAM_CHANGE
error_class: KeyError
error_lines:
  - "KeyError: 'customer_id'"
core_frames:
  - {file: "{path}/load_orders.py", fn: run, code: "df = df[REQUIRED_COLUMNS]"}
  - {file: "{path}/load_orders.py", fn: select_columns, code: "return frame['customer_id']"}
root_cause: "Vendor feed v{version} renamed customer_id to cust_id."
fix: "Updated the column mapping in vendor_schema.yaml (customer_id -> cust_id) and re-ran load_orders."
minutes_to_resolve: {base: 4, jitter: 1}
auto_retry_passes: false
schedule:
  days: [3, 12, 19, 27]      # 2 in the seeded past (3, 12), 2 replayed live (19, 27)
  hour_range: [2, 4]
caused_by_change:
  type: vendor_release
  source: vendor_feed
  lead_hours: 2
  summary: "Vendor feed v{version} released: customer_id renamed to cust_id"
variables:
  version: {type: seq, prefix: "2.", start: 3}
