# S04: IAM key rotation every 7 days. Exactly 4 incidents: the Health Brief closing line.
id: S04
name: expired_s3_credentials
dag_id: inventory_sync
task_id: export_s3
verdict: KNOWN_ISSUE
error_class: ClientError
error_lines:
  - "botocore.exceptions.ClientError: An error occurred (ExpiredToken) when calling the PutObject operation: The provided token has expired."
core_frames:
  - {file: "{path}/export_s3.py", fn: run, code: "s3.put_object(Bucket=BUCKET, Key=key, Body=body)"}
  - {file: "/home/airflow/.local/lib/python3.11/site-packages/botocore/client.py", fn: _make_api_call, code: "raise error_class(parsed_response, operation_name)"}
root_cause: "Weekly IAM access key rotation for svc-inventory-export left the aws_default connection with an expired key."
fix: "Refreshed the aws_default Airflow connection with the new IAM key and re-ran export_s3."
minutes_to_resolve: {base: 6, jitter: 2}
auto_retry_passes: false
schedule:
  days: [4, 11, 18, 25]
  hour_range: [3, 4]
caused_by_change:
  type: infra_rotation
  source: iam
  lead_hours: 1
  summary: "IAM key rotation completed for svc-inventory-export (7-day cycle)"
