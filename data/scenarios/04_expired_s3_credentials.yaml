# Scenario 4: IAM access key rotated weekly, Airflow connection not updated.
id: expired_s3_credentials
name: Expired S3 credentials
dag_id: inventory_sync
task_id: export_s3
operator: S3CreateObjectOperator

truth:
  verdict: KNOWN_ISSUE
  root_cause: "Weekly IAM key rotation for svc-inventory-export; Airflow connection aws_inventory still has the old key"
  fix: "Update Airflow connection aws_inventory from Secrets Manager (qb/svc-inventory-export) and clear the task"
  minutes_to_fix: [60, 25, 8, 6]

days: [7, 14, 21, 28]
hour: 4

change_event:
  type: iam_rotation
  hours_before: 2
  affects_dags: [inventory_sync]
  text: "Security automation rotated IAM access key for svc-inventory-export (weekly rotation)."

vars:
  host: ["ip-10-0-2-40", "ip-10-0-2-41"]
  request_id: "hex:16"
  key: ["inventory/snapshots/{date}/stock_levels.parquet"]

log_template: |
  [{ts}] {{taskinstance.py:1937}} INFO - Executing <Task(S3CreateObjectOperator): export_s3> on {run_id}
  [{ts}] {{base_aws.py:161}} INFO - Using connection ID 'aws_inventory' for task execution.
  [{ts}] {{s3.py:877}} INFO - Uploading {key} to bucket qb-inventory-exports
  [{ts}] {{taskinstance.py:1937}} ERROR - Task failed with exception
  Traceback (most recent call last):
    File "/usr/local/lib/python3.11/site-packages/airflow/providers/amazon/aws/hooks/s3.py", line 1102, in load_bytes
      client.put_object(Bucket=bucket_name, Key=key, Body=bytes_data)
    File "/usr/local/lib/python3.11/site-packages/botocore/client.py", line 1023, in _make_api_call
      raise error_class(parsed_response, operation_name)
  botocore.exceptions.ClientError: An error occurred (ExpiredToken) when calling the PutObject operation: The security token included in the request is expired (RequestId: {request_id})
