# Scenario 2: Kafka metadata timeout. Flaky: always passes on retry.
id: kafka_timeout_flaky
name: Kafka consumer timeout (flaky)
dag_id: events_ingest
task_id: pull_kafka
operator: PythonOperator

truth:
  verdict: FLAKY
  root_cause: "Transient Kafka broker metadata timeout during broker leader election; passes on retry"
  fix: "Auto-retry once; no page. Long-term: raise request_timeout_ms to 120000"
  minutes_to_fix: [20, 3, 2, 1, 1, 1, 1, 1, 1]

days: [2, 5, 9, 12, 16, 19, 23, 26, 30]
hour: 2

vars:
  host: ["ip-10-0-7-21", "ip-10-0-7-22", "ip-10-0-7-23"]
  broker: ["kafka-1.qb.internal:9092", "kafka-2.qb.internal:9092", "kafka-3.qb.internal:9092"]
  partition: "int:0-11"
  offset: "int:1200000-9900000"

log_template: |
  [{ts}] {{taskinstance.py:1937}} INFO - Executing <Task(PythonOperator): pull_kafka> on {run_id}
  [{ts}] {{consumer.py:112}} INFO - Subscribing to app-events partition {partition} from offset {offset}
  [{ts}] {{conn.py:381}} WARNING - <BrokerConnection node_id=2 host={broker}> timed out after 60000 ms
  [{ts}] {{taskinstance.py:1937}} ERROR - Task failed with exception
  Traceback (most recent call last):
    File "/opt/airflow/dags/events/pull.py", line 64, in pull_kafka
      batch = consumer.poll(timeout_ms=60000, max_records=5000)
    File "/usr/local/lib/python3.11/site-packages/kafka/consumer/group.py", line 655, in poll
      raise Errors.KafkaTimeoutError("Failed to update metadata after 60.0 secs.")
  kafka.errors.KafkaTimeoutError: Failed to update metadata after 60.0 secs.
